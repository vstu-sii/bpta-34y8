name: Quality and Safety design

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  golden-dataset:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r tools/quality/requirements.txt
      - run: python tools/quality/evaluate.py validate --output quality-validation.json
      - run: python -m unittest discover -s tools/quality -p "test_*.py" -v
      - uses: actions/upload-artifact@v4
        with:
          name: quality-validation
          path: quality-validation.json
